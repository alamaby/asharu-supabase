# Supabase configuration for the Asharu Digital Hub content-factory workflow.
# Project is created in the Supabase Dashboard; `project_id` is filled in after
# `supabase link`. The CLI reads this file from the submodule root.

project_id = "REPLACE_AFTER_SUPABASE_LINK"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/id", "http://localhost:3000/en"]
jwt_expiry = 3600
enable_signup = false  # Admin invites only; admin emails are seeded in 001_content_factory.sql

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.magic_link]
subject = "Masuk ke Asharu"
content_path = "./supabase/templates/magic_link.html"

[storage]
enabled = true
file_size_limit = "2MiB"

[storage.buckets.affiliate-images]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/webp", "image/png", "image/jpeg"]
