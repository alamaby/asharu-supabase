<!DOCTYPE html>
<html>
  <body style="font-family: Helvetica, Arial, sans-serif; background:#f8fafc; padding:24px;">
    <!-- Direct token_hash flow (preferred over {{ .ConfirmationURL }}):
         {{ .ConfirmationURL }} routes through GoTrue's /auth/v1/redirect and
         arrives at the app as ?code=<pkce>, which requires the code_verifier
         cookie and is fragile across domain/cookie-attribute mismatches.
         Embedding {{ .TokenHash }} + {{ .Type }} lets the app call verifyOtp
         directly — no PKCE cookie dependency. The destination path must be in
         the Dashboard Auth → Redirect URLs allow-list. -->
    <h2 style="color:#0f172a;">Masuk ke Asharu</h2>
    <p style="color:#334155;">Klik tombol berikut untuk masuk (tautan berlaku 1 jam):</p>
    <p>
      <a href="{{ .SiteURL }}/id/auth/exchange?token_hash={{ .TokenHash }}&amp;type={{ .Type }}" style="display:inline-block; background:#075985; color:#ffffff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:bold;">
        Masuk ke Asharu
      </a>
    </p>
    <p style="color:#64748b; font-size:12px;">
      Jika Anda tidak meminta tautan ini, abaikan email ini.
    </p>
  </body>
</html>
